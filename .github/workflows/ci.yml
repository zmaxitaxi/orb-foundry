name: Orb Foundry CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

      - name: Check JavaScript syntax
        run: find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 >"$RUNNER_TEMP/orb-foundry-http.log" 2>&1 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/orb-foundry-http.pid"

      - name: Run browser smoke check
        run: npm run qa:browser-smoke

      - name: Stop static server
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/orb-foundry-http.pid"; then
            kill "$(<"$RUNNER_TEMP/orb-foundry-http.pid")" 2>/dev/null || true
          fi
